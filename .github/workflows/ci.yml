name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend Tests and Course Model Validation
    runs-on: ubuntu-latest

    env:
      ETIS_TEST_POSTGRES_URL: postgresql+psycopg://etis:etis-test-only@127.0.0.1:5432/etis_migration_test

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: etis_migration_test
          POSTGRES_USER: etis
          POSTGRES_PASSWORD: etis-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U etis -d etis_migration_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            apps/api/requirements.txt
            requirements-dev.txt

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run backend tests
        run: python -m pytest -q

      - name: Validate COMP 330 course model
        run: python scripts/validate_course_model.py
