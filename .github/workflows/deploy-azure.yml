name: Deploy Azure

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: etis-engineering-studio

jobs:
  release_gate:
    name: Revalidate Selected Commit
    runs-on: ubuntu-latest

    env:
      ETIS_TEST_POSTGRES_URL: postgresql+psycopg://etis:etis-test-only@127.0.0.1:5432/etis_migration_test

    services:
      postgres:
        image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_DB: etis_migration_test
          POSTGRES_USER: etis
          POSTGRES_PASSWORD: etis-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U etis -d etis_migration_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out selected commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            apps/api/requirements.txt
            apps/api/requirements.lock
            requirements-dev.txt

      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Audit production Python dependencies
        run: python -m pip_audit -r apps/api/requirements.lock

      - name: Validate production database migrations
        run: python -m pytest -q tests/test_v016_database_migrations.py

      - name: Build production API container
        run: docker build -f apps/api/Dockerfile -t etis-engineering-studio:release-gate .

      - name: Smoke test production API container
        run: |
          set -euo pipefail

          cleanup() {
            docker rm -f etis-api-smoke >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run \
            --detach \
            --name etis-api-smoke \
            --network host \
            -e ETIS_ENV=production \
            -e ETIS_DATABASE_URL="${ETIS_TEST_POSTGRES_URL}" \
            -e ETIS_WEB_ORIGIN=https://studio.example.edu \
            -e ETIS_SESSION_SECRET=ci-production-session-secret-at-least-32-characters \
            -e ETIS_DEV_LOGIN=false \
            -e ENTRA_CLIENT_ID=ci-entra-client \
            -e ENTRA_CLIENT_SECRET=ci-entra-secret \
            -e ENTRA_REDIRECT_URI=https://studio.example.edu/auth/entra/callback \
            -e ENTRA_TENANT=11111111-2222-3333-4444-555555555555 \
            -e GITHUB_APP_ID=12345 \
            -e GITHUB_APP_PRIVATE_KEY=ci-placeholder-private-key \
            -e GITHUB_OAUTH_CLIENT_ID=ci-github-client \
            -e GITHUB_OAUTH_CLIENT_SECRET=ci-github-secret \
            -e GITHUB_OAUTH_REDIRECT_URI=https://studio.example.edu/auth/github/callback \
            -e OPENAI_API_KEY=sk-proj-ci-placeholder \
            etis-engineering-studio:release-gate

          for attempt in $(seq 1 30); do
            payload="$(curl -fsS http://127.0.0.1:8000/ready 2>/dev/null || true)"

            if printf '%s' "${payload}" | grep -q '"status":"ready"' \
              && printf '%s' "${payload}" | grep -q '"migration_current":true'; then
              printf '%s\n' "${payload}"
              exit 0
            fi

            sleep 1
          done

          echo "Production container did not become ready."
          docker logs etis-api-smoke || true
          exit 1

      - name: Run backend tests
        run: python -m pytest -q

      - name: Validate COMP 330 course model
        run: python scripts/validate_course_model.py

  deploy:
    name: Deploy Production Infrastructure and Application
    needs: release_gate
    runs-on: ubuntu-latest
    environment: production

    permissions:
      id-token: write
      contents: read

    env:
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      ETIS_WEB_ORIGIN: ${{ vars.ETIS_WEB_ORIGIN }}

      POSTGRES_ADMIN_PASSWORD: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
      ETIS_SESSION_SECRET: ${{ secrets.ETIS_SESSION_SECRET }}

      ENTRA_CLIENT_ID: ${{ vars.ENTRA_CLIENT_ID }}
      ENTRA_CLIENT_SECRET: ${{ secrets.ENTRA_CLIENT_SECRET }}
      ENTRA_TENANT: ${{ secrets.AZURE_TENANT_ID }}

      GITHUB_APP_ID: ${{ vars.GITHUB_APP_ID }}
      GITHUB_APP_SLUG: ${{ vars.GITHUB_APP_SLUG }}
      GITHUB_APP_PRIVATE_KEY: ${{ secrets.GITHUB_APP_PRIVATE_KEY }}

      GITHUB_OAUTH_CLIENT_ID: ${{ vars.GITHUB_OAUTH_CLIENT_ID }}
      GITHUB_OAUTH_CLIENT_SECRET: ${{ secrets.GITHUB_OAUTH_CLIENT_SECRET }}

      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      OPERATIONS_ALERT_EMAIL: ${{ vars.OPERATIONS_ALERT_EMAIL }}

    steps:
      - name: Check out validated commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Azure login (OIDC)
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Validate deployment configuration
        run: |
          set -euo pipefail

          required=(
            AZURE_RESOURCE_GROUP
            AZURE_LOCATION
            ETIS_WEB_ORIGIN
            POSTGRES_ADMIN_PASSWORD
            ETIS_SESSION_SECRET
            ENTRA_CLIENT_ID
            ENTRA_CLIENT_SECRET
            ENTRA_TENANT
            GITHUB_APP_ID
            GITHUB_APP_PRIVATE_KEY
            GITHUB_OAUTH_CLIENT_ID
            GITHUB_OAUTH_CLIENT_SECRET
            OPENAI_API_KEY
            OPERATIONS_ALERT_EMAIL
          )

          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then
              echo "Required production deployment setting is missing: ${name}"
              exit 1
            fi
          done

          case "${ETIS_WEB_ORIGIN}" in
            https://*) ;;
            *)
              echo "ETIS_WEB_ORIGIN must be an HTTPS origin."
              exit 1
              ;;
          esac

          if [ "${#ETIS_SESSION_SECRET}" -lt 32 ]; then
            echo "ETIS_SESSION_SECRET must contain at least 32 characters."
            exit 1
          fi

      - name: Reconcile Azure foundation
        id: foundation
        run: |
          set -euo pipefail

          az deployment group create \
            --name "etis-foundation-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --template-file infra/azure/main.bicep \
            --parameters \
              location="${AZURE_LOCATION}" \
              postgresAdminPassword="${POSTGRES_ADMIN_PASSWORD}" \
            --only-show-errors \
            --output none

          ACR_NAME="$(
            az deployment group show \
              --name "etis-foundation-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
              --resource-group "${AZURE_RESOURCE_GROUP}" \
              --query properties.outputs.containerRegistryName.value \
              --output tsv
          )"

          ACR_LOGIN_SERVER="$(
            az deployment group show \
              --name "etis-foundation-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
              --resource-group "${AZURE_RESOURCE_GROUP}" \
              --query properties.outputs.containerRegistryLoginServer.value \
              --output tsv
          )"

          printf 'acr_name=%s\n' "${ACR_NAME}" >> "${GITHUB_OUTPUT}"
          printf 'acr_login_server=%s\n' "${ACR_LOGIN_SERVER}" >> "${GITHUB_OUTPUT}"

      - name: Provision runtime secrets
        run: |
          set -euo pipefail

          az deployment group create \
            --name "etis-secrets-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --template-file infra/azure/secrets.bicep \
            --parameters \
              postgresAdminPassword="${POSTGRES_ADMIN_PASSWORD}" \
              sessionSecret="${ETIS_SESSION_SECRET}" \
              entraClientSecret="${ENTRA_CLIENT_SECRET}" \
              githubAppPrivateKey="${GITHUB_APP_PRIVATE_KEY}" \
              githubOauthClientSecret="${GITHUB_OAUTH_CLIENT_SECRET}" \
              openAiApiKey="${OPENAI_API_KEY}" \
            --only-show-errors \
            --output none

      - name: Login to ACR
        run: az acr login --name "${{ steps.foundation.outputs.acr_name }}"

      - name: Build and push validated commit
        id: image
        run: |
          set -euo pipefail

          IMAGE="${{ steps.foundation.outputs.acr_login_server }}/${IMAGE_NAME}:${GITHUB_SHA}"

          docker build \
            -f apps/api/Dockerfile \
            -t "${IMAGE}" \
            .

          docker push "${IMAGE}"

          printf 'image=%s\n' "${IMAGE}" >> "${GITHUB_OUTPUT}"

      - name: Reconcile migration job
        id: migration
        run: |
          set -euo pipefail

          az deployment group create \
            --name "etis-migration-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --template-file infra/azure/migration.bicep \
            --parameters \
              location="${AZURE_LOCATION}" \
              containerImage="${{ steps.image.outputs.image }}" \
            --only-show-errors \
            --output none

          MIGRATION_JOB_NAME="$(
            az deployment group show \
              --name "etis-migration-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
              --resource-group "${AZURE_RESOURCE_GROUP}" \
              --query properties.outputs.migrationJobName.value \
              --output tsv
          )"

          printf 'job_name=%s\n' "${MIGRATION_JOB_NAME}" >> "${GITHUB_OUTPUT}"

      - name: Run production database migration
        run: |
          set -euo pipefail

          MIGRATION_JOB="${{ steps.migration.outputs.job_name }}"

          EXECUTION_NAME="$(
            az containerapp job start \
              --name "${MIGRATION_JOB}" \
              --resource-group "${AZURE_RESOURCE_GROUP}" \
              --query name \
              --output tsv
          )"

          if [ -z "${EXECUTION_NAME}" ]; then
            echo "Migration job did not return an execution name."
            exit 1
          fi

          echo "Started migration execution ${EXECUTION_NAME}."

          for attempt in $(seq 1 120); do
            STATUS="$(
              az containerapp job execution show \
                --name "${MIGRATION_JOB}" \
                --resource-group "${AZURE_RESOURCE_GROUP}" \
                --job-execution-name "${EXECUTION_NAME}" \
                --query properties.status \
                --output tsv
            )"

            case "${STATUS}" in
              Succeeded)
                echo "Production database migration succeeded."
                exit 0
                ;;
              Failed)
                echo "Production database migration failed."
                exit 1
                ;;
              *)
                sleep 5
                ;;
            esac
          done

          echo "Timed out waiting for production database migration."
          exit 1

      - name: Deploy production application
        id: application
        run: |
          set -euo pipefail

          ENTRA_REDIRECT_URI="${ETIS_WEB_ORIGIN%/}/auth/entra/callback"
          GITHUB_OAUTH_REDIRECT_URI="${ETIS_WEB_ORIGIN%/}/auth/github/callback"

          az deployment group create \
            --name "etis-app-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --template-file infra/azure/app.bicep \
            --parameters \
              location="${AZURE_LOCATION}" \
              containerImage="${{ steps.image.outputs.image }}" \
              webOrigin="${ETIS_WEB_ORIGIN}" \
              entraClientId="${ENTRA_CLIENT_ID}" \
              entraTenant="${ENTRA_TENANT}" \
              entraRedirectUri="${ENTRA_REDIRECT_URI}" \
              githubAppId="${GITHUB_APP_ID}" \
              githubAppSlug="${GITHUB_APP_SLUG}" \
              githubOauthClientId="${GITHUB_OAUTH_CLIENT_ID}" \
              githubOauthRedirectUri="${GITHUB_OAUTH_REDIRECT_URI}" \
            --only-show-errors \
            --output none

          APP_URL="$(
            az deployment group show \
              --name "etis-app-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
              --resource-group "${AZURE_RESOURCE_GROUP}" \
              --query properties.outputs.containerAppUrl.value \
              --output tsv
          )"

          printf 'app_url=%s\n' "${APP_URL}" >> "${GITHUB_OUTPUT}"

      - name: Reconcile production operational controls
        run: |
          set -euo pipefail

          az deployment group create             --name "etis-operations-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"             --resource-group "${AZURE_RESOURCE_GROUP}"             --template-file infra/azure/operations.bicep             --parameters               location="${AZURE_LOCATION}"               operationsAlertEmail="${OPERATIONS_ALERT_EMAIL}"             --only-show-errors             --output none

      - name: Verify production readiness
        run: |
          set -euo pipefail

          READY_URL="${{ steps.application.outputs.app_url }}/ready"

          for attempt in $(seq 1 60); do
            payload="$(curl -fsS "${READY_URL}" 2>/dev/null || true)"

            if printf '%s' "${payload}" | grep -q '"status":"ready"' \
              && printf '%s' "${payload}" | grep -q '"migration_current":true'; then
              printf '%s\n' "${payload}"
              exit 0
            fi

            sleep 5
          done

          echo "Production application did not report ready."
          exit 1
