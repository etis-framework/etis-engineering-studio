name: Deploy Azure
on:
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
env:
  IMAGE_NAME: etis-engineering-studio
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Login to ACR
        run: az acr login --name "${{ vars.AZURE_ACR_NAME }}"
      - name: Build and push
        run: |
          IMAGE="${{ vars.AZURE_ACR_LOGIN_SERVER }}/${IMAGE_NAME}:${GITHUB_SHA}"
          docker build -f apps/api/Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
      - name: Deploy container app
        run: az containerapp update --name "${{ vars.AZURE_CONTAINER_APP_NAME }}" --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" --image "$IMAGE"
